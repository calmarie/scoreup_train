<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ScoreUp Train API</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.34.1/swagger-ui.css" crossorigin="anonymous">
</head>
<body>
  <main id="swagger-ui">To open use instruction from README.</main>
  <script src="https://unpkg.com/swagger-ui-dist@5.34.1/swagger-ui-bundle.js" crossorigin="anonymous"></script>
  <script>
    if (location.protocol !== "file:") {
      if (typeof SwaggerUIBundle === "function") {
        SwaggerUIBundle({
          url: "./openapi.json",
          dom_id: "#swagger-ui",
          deepLinking: true,
          validatorUrl: null,
          supportedSubmitMethods: []
        });
      } else {
        document.getElementById("swagger-ui").textContent =
          "Failed to open Swagger UI.";
      }
    }
  </script>
</body>
</html>
