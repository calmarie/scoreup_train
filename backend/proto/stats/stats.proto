syntax = "proto3";

package stats;

option go_package = "github.com/calmarie/scoreup_train/backend/gen/stats;statspb";

import "google/type/date.proto";

service Stats {
    rpc GetStats(UserStatsRequest) returns (GetStatsReply);
    rpc GetXP(UserStatsRequest) returns (GetXPReply);
    rpc GetCurrentStreak(UserStatsRequest) returns (GetCurrentStreakReply);
    rpc GetCurrentCorrectStreak(UserStatsRequest) returns (GetCurrentCorrectStreakReply);
    rpc GetDailyStats(GetDailyStatsRequest) returns (DailyStats);
    rpc GetWeeklyStats(UserStatsRequest) returns (GetWeeklyStatsReply);
    rpc GetTopicStats(GetTopicStatsRequest) returns (TopicStats);
    rpc GetAllTopicStats(UserStatsRequest) returns (GetAllTopicStatsReply);
}

message UserStatsRequest {
    int64 user_id = 1;
}

message GetDailyStatsRequest {
    int64 user_id = 1;
    google.type.Date date = 2;
}

message GetTopicStatsRequest {
    int64 user_id = 1;
    string topic = 2;
}

message GetStatsReply {
    int64 user_id = 1;
    int64 xp = 2;
    int64 total_answers = 3;
    int64 correct_answers = 4;
    int64 unique_solved = 5;
    int32 active_days = 6;
    int64 current_streak = 7;
    int64 max_streak = 8;
    int64 current_correct_streak = 9;
    int64 best_correct_streak = 10;
    google.type.Date last_solved_on = 11; // UTC calendar date. Unset until the first solve.
    double accuracy_percent = 12;
}

message DailyStats {
    google.type.Date date = 1;
    int64 attempts = 2;
    int64 correct = 3;
    int64 solved = 4;
    int64 xp = 5;
}

message TopicStats {
    string topic = 1;
    int64 attempts = 2;
    int64 correct = 3;
    int64 solved = 4;
    int64 xp = 5;
}

message GetWeeklyStatsReply {
    repeated DailyStats days = 1;
}

message GetAllTopicStatsReply {
    repeated TopicStats topics = 1;
}

message GetXPReply {
    int64 xp = 1;
}

message GetCurrentStreakReply {
    int64 current_streak = 1;
}

message GetCurrentCorrectStreakReply {
    int64 current_correct_streak = 1;
}
