//protoc --proto_path=. --go_out=. --go_opt=module=github.com/calmarie/scoreup_train --go-grpc_out=. --go-grpc_opt=module=github.com/calmarie/scoreup_train backend/proto/user/user.proto 

syntax = "proto3";

package user;

option go_package = "github.com/calmarie/scoreup_train/backend/gen/user;userpb";

import "google/protobuf/timestamp.proto";

service User {
    rpc CreateUser(CreateUserRequest) returns (AuthReply);
    rpc GetUserByTelegramID(GetUserByTelegramIDRequest) returns (UserReply);
    rpc RefreshAccess(RefreshAccessRequest) returns (RefreshAccessReply);
}

message RefreshAccessRequest {
    int64 telegram_id = 1;
    string refresh_token = 2;
}

message RefreshAccessReply {
    string access_token = 1;
    string refresh_token = 2;
    int64 expires_in = 3;
}

message CreateUserRequest {
    int64 telegram_id = 1;
}

message GetUserByTelegramIDRequest {
    int64 telegram_id = 1;
}

message UserReply {
    int64 id = 1;
    int64 telegram_id = 2;
    google.protobuf.Timestamp created_at = 3;
}

message AuthReply {
    UserReply user = 1;
    string access_token = 2;
    string refresh_token = 3;
    int64 expires_in = 4;
    bool created = 5;
}
