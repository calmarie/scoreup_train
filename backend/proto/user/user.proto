//protoc --proto_path=. --go_out=. --go_opt=module=github.com/calmarie/scoreup_train --go-grpc_out=. --go-grpc_opt=module=github.com/calmarie/scoreup_train backend/proto/user/user.proto 

syntax = "proto3";

package user;

option go_package = "github.com/calmarie/scoreup_train/backend/gen/user;userpb";

import "google/protobuf/timestamp.proto";

service User {
    rpc CreateUser(CreateUserRequest) returns (UserReply);
    rpc GetUserByTelegramID(GetUserByTelegramIDRequest) returns (UserReply);
    rpc AwardQuestionXP(AwardQuestionXPRequest) returns (AwardQuestionXPReply);
}

message CreateUserRequest {
    int64 telegram_id = 1;
}

message GetUserByTelegramIDRequest {
    int64 telegram_id = 1;
}

message UserReply {
    int64 id = 1;
    int64 telegram_id = 2;
    google.protobuf.Timestamp created_at = 3;
    int32 xp_total = 4;
}

message AwardQuestionXPRequest {
    int64 user_id = 1;
    int32 question_id = 2;
    int32 xp = 3;
}

message AwardQuestionXPReply {
    bool awarded = 1;
}
