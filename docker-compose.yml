services:
  user-postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${USER_POSTGRES_DB:-scoreup_users}
    ports:
      - "${USER_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${USER_POSTGRES_DB:-scoreup_users}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - user-pg-data:/var/lib/postgresql

  training-postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - training-pg-data:/var/lib/postgresql

  migrate-user:
    image: migrate/migrate
    volumes:
      - ./backend/user-service/postgres/migrations:/migrations:ro
    environment:
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      user-postgres:
        condition: service_healthy
    command:
      - -path
      - /migrations
      - -database
      - postgres://user-postgres:5432/${USER_POSTGRES_DB:-scoreup_users}?sslmode=disable
      - up

  migrate-training:
    image: migrate/migrate
    volumes:
      - ./backend/training-service/postgres/migrations:/migrations:ro
    environment:
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      training-postgres:
        condition: service_healthy
    command:
      - -path
      - /migrations
      - -database
      - postgres://training-postgres:5432/${POSTGRES_DB}?sslmode=disable
      - up

volumes:
  user-pg-data:
  training-pg-data:
