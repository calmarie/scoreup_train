services:
 
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
    - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
    - pg-data:/var/lib/postgresql


  migrate:
    image: migrate/migrate
    volumes:
    - ./migrations:/migrations
    environment:
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    command: 
      [
        "-path", "/migrations",
        "-database",
        "postgres://postgres:5432/${POSTGRES_DB}?sslmode=disable",
        "up"
      ]

  scoreup_train:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      HTTP_PORT: ${HTTP_PORT}

    ports:
      - "${HTTP_PORT}:${HTTP_PORT}"


volumes:
  pg-data:
