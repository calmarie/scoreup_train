services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:4.1.1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:19092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - kafka-data:/var/lib/kafka/data

  init-kafka:
    image: apache/kafka:4.1.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command: ["--bootstrap-server", "kafka:19092", "--create", "--if-not-exists", "--topic", "question-solved", "--partitions", "1", "--replication-factor", "1"]

  user-postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${USER_POSTGRES_DB:-scoreup_users}
    ports:
      - "${USER_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", 'PGPASSWORD="$${POSTGRES_PASSWORD}" psql -h user-postgres -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -tAc "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - user-pg-data:/var/lib/postgresql

  training-postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${TRAINING_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${TRAINING_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", 'PGPASSWORD="$${POSTGRES_PASSWORD}" psql -h training-postgres -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -tAc "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - training-pg-local-data:/var/lib/postgresql

  stats-postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${STATS_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${STATS_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${STATS_POSTGRES_DB:-scoreup_stats}
    ports:
      - "127.0.0.1:${STATS_POSTGRES_PORT:-5436}:5432"
    healthcheck:
      test: ["CMD-SHELL", 'PGPASSWORD="$${POSTGRES_PASSWORD}" psql -h stats-postgres -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -tAc "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - stats-pg-data:/var/lib/postgresql

  migrate-user:
    image: migrate/migrate
    volumes:
      - ./backend/user-service/postgres/migrations:/migrations:ro
    environment:
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      user-postgres:
        condition: service_healthy
    command:
      - -path
      - /migrations
      - -database
      - postgres://user-postgres:5432/${USER_POSTGRES_DB:-scoreup_users}?sslmode=disable
      - up

  migrate-training:
    image: migrate/migrate
    volumes:
      - ./backend/training-service/postgres/migrations:/migrations:ro
    environment:
      PGUSER: ${TRAINING_POSTGRES_USER:-postgres}
      PGPASSWORD: ${TRAINING_POSTGRES_PASSWORD:-postgres}
    depends_on:
      training-postgres:
        condition: service_healthy
    command:
      - -path
      - /migrations
      - -database
      - postgres://training-postgres:5432/${POSTGRES_DB}?sslmode=disable
      - up

  migrate-stats:
    image: migrate/migrate
    volumes:
      - ./backend/stats-service/postgres/migrations:/migrations:ro
    environment:
      PGUSER: ${STATS_POSTGRES_USER:-postgres}
      PGPASSWORD: ${STATS_POSTGRES_PASSWORD:-postgres}
    depends_on:
      stats-postgres:
        condition: service_healthy
    command:
      - -path
      - /migrations
      - -database
      - postgres://stats-postgres:5432/${STATS_POSTGRES_DB:-scoreup_stats}?sslmode=disable
      - up

  user-service:
    build:
      context: .
      dockerfile: backend/user-service/Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      USER_POSTGRES_DB: ${USER_POSTGRES_DB:-scoreup_users}
      USER_POSTGRES_HOST: user-postgres
      USER_POSTGRES_PORT: "5432"
      REDIS_URL: redis:6379
    volumes:
      - ./certs/user.crt:/app/certs/user.crt:ro
      - ./certs/user.key:/app/certs/user.key:ro
      - ./certs/private.pem:/app/certs/private.pem:ro
    ports:
      - "${USER_GRPC_PORT:-50053}:50053"
    depends_on:
      migrate-user:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  training-service:
    build:
      context: .
      dockerfile: backend/training-service/Dockerfile
    environment:
      POSTGRES_USER: ${TRAINING_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${TRAINING_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: training-postgres
      POSTGRES_PORT: "5432"
      KAFKA_URL: kafka:19092
    volumes:
      - ./certs/training.crt:/app/certs/training.crt:ro
      - ./certs/training.key:/app/certs/training.key:ro
    ports:
      - "${TRAINING_GRPC_PORT:-50052}:50052"
    depends_on:
      migrate-training:
        condition: service_completed_successfully
      init-kafka:
        condition: service_completed_successfully

  stats-service:
    build:
      context: .
      dockerfile: backend/stats-service/Dockerfile
    environment:
      POSTGRES_USER: ${STATS_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${STATS_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${STATS_POSTGRES_DB:-scoreup_stats}
      POSTGRES_HOST: stats-postgres
      POSTGRES_PORT: "5432"
      KAFKA_URL: kafka:19092
    volumes:
      - ./certs/stats.crt:/app/certs/stats.crt:ro
      - ./certs/stats.key:/app/certs/stats.key:ro
    depends_on:
      migrate-stats:
        condition: service_completed_successfully
      init-kafka:
        condition: service_completed_successfully

  api-gateway:
    build:
      context: .
      dockerfile: backend/api-gateway/Dockerfile
    environment:
      HTTP_PORT: "8080"
      USER_SERVICE_URL: user-service:50053
      TRAINING_SERVICE_URL: training-service:50052
      STATS_SERVICE_URL: stats-service:50054
    volumes:
      - ./certs/ca.pem:/app/certs/ca.pem:ro
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      user-service:
        condition: service_started
      training-service:
        condition: service_started
      stats-service:
        condition: service_started

  training-postgres-test:
    profiles: [test]
    image: postgres:18
    environment:
      POSTGRES_USER: ${TRAINING_TEST_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${TRAINING_TEST_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB_TEST}
    ports:
      - "${TRAINING_TEST_POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", 'PGPASSWORD="$${POSTGRES_PASSWORD}" psql -h training-postgres-test -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -tAc "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - training-test-pg-data:/var/lib/postgresql

  migrate-training-test:
    profiles: [test]
    image: migrate/migrate
    volumes:
      - ./backend/training-service/postgres/migrations:/migrations:ro
    environment:
      PGUSER: ${TRAINING_TEST_POSTGRES_USER:-postgres}
      PGPASSWORD: ${TRAINING_TEST_POSTGRES_PASSWORD:-postgres}
    depends_on:
      training-postgres-test:
        condition: service_healthy
    command:
      - -path
      - /migrations
      - -database
      - postgres://training-postgres-test:5432/${POSTGRES_DB_TEST}?sslmode=disable
      - up

volumes:
  redis-data:
  kafka-data:
  user-pg-data:
  training-pg-local-data:
  stats-pg-data:
  training-test-pg-data:
